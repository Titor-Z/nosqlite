name: Docs

# 文档站(VitePress)构建与部署。
# 触发:站点内容/主题/配置变更,或手动。
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "package.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署;不取消进行中的(避免部署到一半被打断)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci

      # VitePress 构建本身会检查死链(ignoreDeadLinks: false),
      # 失效链接会让构建失败 —— 防止文档慢慢腐化。
      - name: 构建站点
        run: npm run docs:build

      # 构建产物冒烟:首页与关键页存在、物理动效 chunk 在
      - name: 校验产物
        run: |
          set -e
          test -f site/.vitepress/dist/index.html
          test -f site/.vitepress/dist/reference/performance.html
          test -f site/.vitepress/dist/quickstart/rust.html
          ls site/.vitepress/dist/assets/chunks/ | grep -q matter && echo "matter chunk ok"

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
