name: Docs

# 文档站(VitePress)构建与部署。
# 触发:站点内容/主题/配置变更,或手动。
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "package.json"
      - "studio-ui/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "web/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署;不取消进行中的(避免部署到一半被打断)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci

      # Playground 是 studio 的静态产物,和文档站一起部署:
      # 先编 wasm 引擎,再用 bun 构建前端,最后塞进 VitePress 的 public 目录。
      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: 构建 WASM 引擎
        run: |
          rustup target add wasm32-wasip1
          cargo build --release --lib --target wasm32-wasip1
          # public/ 里只有被 gitignore 的 wasm,仓库中不存在该目录
          mkdir -p studio-ui/public
          cp target/wasm32-wasip1/release/nodblite.wasm studio-ui/public/nodblite.wasm

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2

      - name: 构建 Playground 前端
        working-directory: studio-ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: 复制 Playground 到站点
        run: |
          mkdir -p site/public/playground
          cp -R studio-ui/dist/. site/public/playground/

      # VitePress 构建本身会检查死链(ignoreDeadLinks: false),
      # 失效链接会让构建失败 —— 防止文档慢慢腐化。
      - name: 构建站点
        run: npm run docs:build

      # 构建产物冒烟:首页与关键页存在、物理动效 chunk 在
      - name: 校验产物
        run: |
          set -e
          test -f site/.vitepress/dist/index.html
          test -f site/.vitepress/dist/reference/performance.html
          test -f site/.vitepress/dist/playground/index.html
          test -f site/.vitepress/dist/playground/nodblite.wasm
          test -f site/.vitepress/dist/quickstart/rust.html
          ls site/.vitepress/dist/assets/chunks/ | grep -q matter && echo "matter chunk ok"

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
