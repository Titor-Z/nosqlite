name: Release

# 推送 v* tag 时,构建三大平台的:
#   1. CLI 二进制(nodblite / nodblite.exe);
#   2. C ABI 库产物(动态库 + 静态库 + 头文件),供任意语言进程内嵌入。
# 两者各自打包并附 SHA256 到 GitHub Release。
# crates.io 的库发布由维护者本地执行(cargo publish,见 README「发布」)。
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

# 创建 Release 并上传二进制需要写 contents 权限(默认 GITHUB_TOKEN 只读)
permissions:
  contents: write

jobs:
  build:
    name: 构建(${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x86_64
            archive: nodblite-cli-linux-x86_64.tar.gz
            lib_archive: nodblite-ffi-linux-x86_64.tar.gz
            dylib: libnodblite.so
            staticlib: libnodblite.a
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos-aarch64
            archive: nodblite-cli-macos-aarch64.tar.gz
            lib_archive: nodblite-ffi-macos-aarch64.tar.gz
            dylib: libnodblite.dylib
            staticlib: libnodblite.a
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows-x86_64
            archive: nodblite-cli-windows-x86_64.zip
            lib_archive: nodblite-ffi-windows-x86_64.zip
            dylib: nodblite.dll
            staticlib: nodblite.lib
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存构建产物
        uses: Swatinem/rust-cache@v2

      - name: 构建(release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: 打包(Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} nodblite
          cd ../../..
          shasum -a 256 ${{ matrix.archive }} > ${{ matrix.archive }}.sha256

      - name: 打包 C ABI 库(Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          # 库 + 头文件,保持 include/ 目录结构,下游可直接 -Iinclude
          tar czf ../../../${{ matrix.lib_archive }} \
            ${{ matrix.dylib }} ${{ matrix.staticlib }} \
            -C "$GITHUB_WORKSPACE" include
          cd ../../..
          shasum -a 256 ${{ matrix.lib_archive }} > ${{ matrix.lib_archive }}.sha256

      - name: 打包(Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/nodblite.exe `
            -DestinationPath ${{ matrix.archive }}
          (Get-FileHash ${{ matrix.archive }} -Algorithm SHA256).Hash | `
            Out-File -Encoding ascii ${{ matrix.archive }}.sha256

          # C ABI 库产物(动态库 + 静态库 + 头文件)
          New-Item -ItemType Directory -Force -Path stage/include | Out-Null
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.dylib }} stage/
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.staticlib }} stage/
          Copy-Item include/nodblite.h stage/include/
          Compress-Archive -Path stage/* -DestinationPath ${{ matrix.lib_archive }}
          (Get-FileHash ${{ matrix.lib_archive }} -Algorithm SHA256).Hash | `
            Out-File -Encoding ascii ${{ matrix.lib_archive }}.sha256

      - name: 校验库产物存在
        if: runner.os != 'Windows'
        run: |
          test -f target/${{ matrix.target }}/release/${{ matrix.dylib }}
          test -f target/${{ matrix.target }}/release/${{ matrix.staticlib }}

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
            ${{ matrix.lib_archive }}
            ${{ matrix.lib_archive }}.sha256

  # wasm32-wasip1:一个 .wasm 覆盖所有平台所有语言(JS/Python/Go/...)。
  # 与上面的多平台二进制不同,它只需构建一次,产物 ~2.5 MB(gzip 后 ~790 KB)。
  wasm:
    name: 构建(wasm32-wasip1)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: 缓存构建产物
        uses: Swatinem/rust-cache@v2

      - name: 构建(release)
        run: cargo build --release --target wasm32-wasip1 --lib

      # 发布前必须真跑一遍:布局常量写错只会表现为静默乱码/越界,
      # 「能编译」不代表产物可用。
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 冒烟验证
        run: node web/smoke.mjs --wasm target/wasm32-wasip1/release/nodblite.wasm

      - name: 打包
        run: |
          mkdir -p stage
          cp target/wasm32-wasip1/release/nodblite.wasm stage/
          cp include/nodblite.h stage/
          cp web/nodblite.js stage/
          cp web/smoke.mjs stage/
          tar czf nodblite-wasm.tar.gz -C stage \
            nodblite.wasm nodblite.h nodblite.js smoke.mjs
          shasum -a 256 nodblite-wasm.tar.gz > nodblite-wasm.tar.gz.sha256

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nodblite-wasm.tar.gz
            nodblite-wasm.tar.gz.sha256
