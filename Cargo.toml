[package]
name = "nosqlite"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "一个像 SQLite 一样小巧的单文件 NoSQL 数据库(.nodb):MongoDB 风格文档模型,单文件零配置部署"
license = "Apache-2.0"
repository = "https://github.com/Titor-Z/nosqlite"
keywords = ["database", "nosql", "embedded", "document", "single-file"]
categories = ["database-implementations"]
readme = "README.md"

[dependencies]
redb = "3"
regex = "1"
serde_json = "1"

[dev-dependencies]
redb = "3"

[[bin]]
name = "nosqlite"
path = "src/main.rs"
