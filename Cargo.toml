[package]
name = "nosqlite"
version = "0.6.3"
edition = "2024"
rust-version = "1.85"
description = "一个像 SQLite 一样小巧的单文件 NoSQL 数据库(.nodb):MongoDB 风格文档模型,单文件零配置部署"
license = "Apache-2.0"
repository = "https://github.com/Titor-Z/nosqlite"
keywords = ["database", "nosql", "embedded", "document", "single-file"]
categories = ["database-implementations"]
readme = "README.md"
# 测试用的 Node 依赖体积大且与 crate 无关,不打进发布包
exclude = ["tests/node_compat/node_modules", "tests/node_compat/.npm-cache"]

[dependencies]
redb = "3"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
redb = "3"

[[bin]]
name = "nosqlite"
path = "src/main.rs"

[lib]
name = "nosqlite"
# rlib 供 Rust 调用;cdylib/staticlib 供 C ABI(nosqlite-ffi)链接
crate-type = ["rlib", "cdylib", "staticlib"]
