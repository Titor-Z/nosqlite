<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>NODBLITE // STUDIO</title>
    <script>
      // 首屏前应用主题,避免亮暗切换闪烁。三态:system / light / dark
      (() => {
        const pref = localStorage.getItem('nodblite.theme') || 'system';
        const dark =
          pref === 'dark' ||
          (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f2ede3'/%3E%3Cpath d='M8 2l6 6-6 6-6-6z' fill='%23d6281e'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
