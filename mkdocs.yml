site_name: nodblite
site_description: 像 SQLite 一样小巧的单文件 NoSQL 数据库 —— MongoDB 风格文档模型,.nodb 零配置部署
site_url: https://titor-z.github.io/nosqlite/
repo_url: https://github.com/Titor-Z/nosqlite
repo_name: Titor-Z/nosqlite
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    # 跟随系统深浅色
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

plugins:
  - search:
      lang:
        - zh
        - en

nav:
  - 首页: index.md
  - 快速开始:
      - Rust 内嵌: quickstart/rust.md
      - C ABI: quickstart/c-api.md
      - JavaScript: quickstart/javascript.md
      - 命令行: quickstart/cli.md
      - MongoDB 驱动: quickstart/wire.md
  - 使用指南:
      - 查询: guide/query.md
      - 更新: guide/update.md
      - 投影: guide/projection.md
      - 索引: guide/indexes.md
      - 聚合: guide/aggregate.md
  - 参考:
      - 与 MongoDB 的差异: reference/compatibility.md
      - 性能: reference/performance.md
      - 常见问题: reference/faq.md
